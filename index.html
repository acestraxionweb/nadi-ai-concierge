<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zayd — NADI AI Concierge</title>
  <meta name="description" content="NADI AI Concierge">
  <link rel="icon" type="image/svg+xml" href="assets/nadi-logo.svg">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Markdown & Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.2/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-main">
    
    <!-- Minimal Clean Header -->
    <header class="chat-header">
      <div class="header-left">
        <div class="header-logo-badge">
          <img src="assets/nadi-logo.svg" alt="NADI Logo" class="header-nadi-img">
        </div>
        <span class="model-title">Zayd</span>
        <span class="model-badge">AI Concierge</span>
      </div>

      <div class="header-right">
        <button class="btn-icon" id="newChatHeaderBtn" title="New chat">
          <i data-lucide="square-pen"></i>
        </button>
      </div>
    </header>

    <!-- Scrollable Chat Stream (Hidden Scrollbar) -->
    <div class="messages-container" id="messagesContainer">
      
      <!-- Minimal Empty State -->
      <div class="empty-state" id="emptyState">
        <div class="empty-logo">
          <div class="logo-badge">
            <img src="assets/nadi-logo.svg" alt="NADI Logo" class="nadi-brand-img">
          </div>
        </div>
        <h1 class="empty-title">What would you like to explore?</h1>
        
        <div class="quick-prompts-grid">
          <button class="quick-prompt-btn" data-prompt="How does NADI integrate AI into existing workflows?">
            <span>How does NADI integrate AI into existing workflows?</span>
          </button>
          <button class="quick-prompt-btn" data-prompt="What business operations can NADI automate?">
            <span>What business operations can NADI automate?</span>
          </button>
          <button class="quick-prompt-btn" data-prompt="How do human approvals work in your systems?">
            <span>How do human approvals work in your systems?</span>
          </button>
          <button class="quick-prompt-btn" data-prompt="I want to discuss an AI integration project.">
            <span>I want to discuss an AI integration project</span>
          </button>
        </div>
      </div>

      <!-- Chat Messages Thread -->
      <div class="messages-thread" id="messagesFeed"></div>

      <!-- Typing Indicator -->
      <div class="typing-row hidden" id="typingIndicator">
        <div class="typing-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <!-- Minimal Bottom Composer -->
    <div class="composer-area">
      <div class="composer-box">
        <textarea 
          id="messageInput" 
          class="composer-textarea" 
          placeholder="Message Zayd..." 
          rows="1"
          maxlength="6000"
          autofocus
        ></textarea>
        <button type="button" class="btn-send-round" id="sendBtn" title="Send message" disabled>
          <i data-lucide="arrow-up"></i>
        </button>
      </div>
      <div class="composer-footnote">
        <span>Zayd is an AI Concierge. Verify important integration details with NADI.</span>
      </div>
    </div>

  </div>

  <!-- Toast notifications -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js"></script>
</body>
</html>
